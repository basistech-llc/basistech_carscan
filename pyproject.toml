[tool.poetry]
name = "basistech_carscan"
version = "0.1.0"
description = "basistech carscan"
authors = ["Simson Garfinkel <simsong@basistech.com>"]
license = "(C) BasisTech, LLC. All Rights Reserved"
readme = "README.md"
packages = [
    { include = "app", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
boto3 = "^1.40.71"
jinja2 = "^3.1.6"
pydantic = "^2.12.4"
boto3-stubs = { version = "*", extras = ["essential", "route53", "secretsmanager", "dynamodb", "s3"] }
pylint = "^4.0.4"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
aws-lambda-powertools = "^3.24.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pylint (>=4.0.4,<5.0.0)",
    "pyright (>=1.1.407,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.pylint.MASTER]
ignore = ["vendor"]

[tool.pylint.messages_control]
# Disable specific messages by their symbolic name or message ID.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "unspecified-encoding",
    "redefined-outer-name",
    "unused-argument",
    "invalid-name",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "fixme",
    "trailing-whitespace",
    "trailing-newlines",
    "too-many-positional-arguments",
]


[tool.pyright]
exclude    = ["**/vendor"]

[tool.pytest.ini_options]
testpaths     = ["tests"]

[tool.black]
extend-exclude = ["tests"]

[tool.coverage.run]
omit = [ "**/vendor/*" ]
