<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/static/favicon-32x32.png" type="image/png"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>BasisTech LPR</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-container">
        <div class="tabs">
            <button onclick="showTab('scan')" class="active">Scanner</button>
            <button onclick="showTab('history')">My History</button>
            <button onclick="showTab('all')">All</button>
        </div>

        <div id="scan-tab" class="tab-content active">
            <div class="camera-wrapper">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
            <input type="file" id="library-input" accept="image/*" style="display:none;">
            <button type="button" class="btn-library" onclick="document.getElementById('library-input').click()">[upload photo from library]</button>

            <div class="controls">
                <div class="input-group">
                    <input type="text" id="manual-plate" placeholder="Manual Entry...">
                    <button class="btn-secondary" id="manual-plate-button">Go</button>
                </div>

                <div id="result-display" class="result-box hidden">
                    <h2 id="result-name"></h2>
                    <p id="result-details"></p>
                </div>

                <button id="scan-btn" onclick="captureAndScan()">[scan]</button>
                <div class="bottom-spacer" aria-hidden="true"></div>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <button onclick="loadHistory()" style="margin-bottom:10px;">Refresh</button>
            <ul id="history-list"></ul>
        </div>

        <div id="all-tab" class="tab-content">
            <input type="text" id="all-plates-search" placeholder="Search plates or names..." class="all-plates-search">
            <div class="all-plates-table-wrapper">
                <table class="all-plates-table">
                    <thead>
                        <tr>
                            <th>plate</th>
                            <th>name</th>
                        </tr>
                    </thead>
                    <tbody id="all-plates-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <footer class="user-footer">
        <span class="user-email">Logged in as {{ user_email }}</span>
        <a href="/auth/logout" class="btn-logout">Log out</a>
    </footer>
    <script src="static/camera.js"></script>
</body>
</html>
