name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Poetry via pipx (official method)
      run: |
        python -m pip install --upgrade pip
        python -m pip install pipx
        python -m pipx ensurepath
        pipx install poetry
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install Python and JavaScript dependencies
      run: |
        poetry install

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Install Java (for DynamoDB Local)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install AWS CLI
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update

    - name: Install DynamoDB Local
      run: make bin/DynamoDBLocal.jar

    - name: Install MinIO
      run: make bin/minio

    - name: Start DynamoDB Local and MinIO
      run: |
        export AWS_REGION=local
        make start_local_dynamodb
        make start_local_minio
        make make-local-bucket

    - name: Run full test suite
      run: |
        export AWS_REGION=local
        make check

    - name: Stop services
      run: |
        make stop_local_dynamodb || true
        make stop_local_minio || true
