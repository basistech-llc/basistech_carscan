AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  License Plate Scanner (BasisTech/Brivo)
  Now using direct parameters for Domain management.

Globals:
  Function:
    Architectures: [ arm64 ]
    Environment:
      Variables:
        LOG_LEVEL: !Ref LogLevel
        DEPLOYMENT_TIMESTAMP: !Ref DeploymentTimestamp
#        TABLE_NAME: !Ref MyTable
#        BUCKET_NAME: !Ref UploadBucket
        GOOGLE_SECRET_ARN: !Ref GoogleClientSecretArn
        BRIVO_SECRET_ARN: !Ref BrivoApiKeyArn

Parameters:
  StageName:
    Type: String
    Default: stage
    AllowedValues: [prod, stage]
    Description: The deployment environment (e.g., prod, stage, dev).

  CustomDomainName:
    Type: String
    Description: "The full domain name (e.g., v2.cybersecurity-policy.org)"

  HostedZoneId:
    Type: String
    Description: "Route53 Hosted Zone ID for domain validation and DNS records."

  CertificateArn:
    Type: String
    Default: ""
    Description: "(Optional) Existing ACM Certificate ARN. Leave blank to auto-create one for CustomDomainName."

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET]

  DeploymentTimestamp:
    Type: String
    Default: 'Not Set'
    Description: "Deployment UTC timestamp."

  GoogleClientSecretArn:
    Type: String
    Description: "ARN of the Google OAuth Secret in Secrets Manager"

  BrivoApiKeyArn:
    Type: String
    Description: "ARN of the Brivo API Key in Secrets Manager"

Conditions:
  # Logic: If CertificateArn is empty, we create a new one
  CreateAcmCert: !Equals [!Ref CertificateArn, ""]

Resources:
  # --- Infrastructure / Networking ---
  HomeCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateAcmCert
    Properties:
      DomainName: !Ref CustomDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref CustomDomainName
          HostedZoneId: !Ref HostedZoneId

#  # --- Storage ---
#  UploadBucket:
#    Type: AWS::S3::Bucket
#    Properties:
#      NotificationConfiguration:
#        EventBridgeConfiguration:
#          EventBridgeEnabled: true
#
#  MyTable:
#    Type: AWS::DynamoDB::Table
#    DeletionPolicy: Retain
#    UpdateReplacePolicy: Retain
#    Properties:
#      TableName: !Sub "cala-garage-scans-${StageName}" # Added suffix to avoid collisions
#      AttributeDefinitions:
#        - AttributeName: user_email
#          AttributeType: S
#        - AttributeName: sk
#          AttributeType: S
#      KeySchema:
#        - AttributeName: user_email
#          KeyType: HASH
#        - AttributeName: sk
#          KeyType: RANGE
#      BillingMode: PAY_PER_REQUEST
#      PointInTimeRecoverySpecification:
#        PointInTimeRecoveryEnabled: true

  MyHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['GET','POST','OPTIONS']
      Domain:
        DomainName: !Ref CustomDomainName
        CertificateArn: !If [CreateAcmCert, !Ref HomeCertificate, !Ref CertificateArn]
        Route53:
          HostedZoneId: !Ref HostedZoneId

  MyWebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
      BuildProperties:
        RequirementsFile: requirements.txt   # relative to CodeUri (src/)
    Properties:
      Description: !Sub "API Gateway for ${StageName} environment"
      Runtime: python3.13
      CodeUri: src/
      Handler: app.main.lambda_handler
      Timeout: 60
      MemorySize: 512
#      Policies:
#        - S3CrudPolicy:
#            BucketName: !Ref UploadBucket
#        - DynamoDBCrudPolicy:
#            TableName: !Ref MyTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /{proxy+}
            Method: ANY
#        S3UploadEvent:
#          Type: EventBridgeRule
#          Properties:
#            Pattern:
#              source: [ "aws.s3" ]
#              detail-type: [ "Object Created" ]
#              detail:
#                bucket:
#                  name: [ !Ref UploadBucket ]
#                object:
#                  key: [ { "prefix": "uploads/" } ]
#        HeartbeatEvent:
#          Type: Schedule
#          Properties:
#            Schedule: rate(5 minutes)
#            Input: '{"source": "aws.events", "detail-type": "Scheduled Event"}'

Outputs:
  ApiEndpoint:
    Description: "The custom domain URL for your API"
    Value: !Sub "https://${CustomDomainName}/"

  StackRegion:
    Description: "Region this stack is deployed to"
    Value: !Ref "AWS::Region"
