#
# Create the CarScan Lambda which hosts the carscan application

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  License Plate Scanner (BasisTech/Brivo)
  Now using direct parameters for Domain management.

Globals:
  Function:
    Architectures: [ arm64 ]
    Environment:
      Variables:
        LOG_LEVEL: !Ref LogLevel
        DEPLOYMENT_TIMESTAMP: !Ref DeploymentTimestamp
        GOOGLE_SECRET_ARN: !Ref GoogleClientSecretArn
        BRIVO_SECRET_ARN: !Ref BrivoApiKeyArn
        BUCKET_NAME: !Ref ImageBucketName
        TABLE_NAME: !Ref BrivoScanTable

Parameters:
  CustomDomainName:
    Type: String
    Description: "The full domain name (e.g., v2.cybersecurity-policy.org)"

  ImageBucketName:
    Type: String
    Description: "S3 name of image bucket (e.g. basistech-license-images)"

  HostedZoneId:
    Type: String
    Description: "Route53 Hosted Zone ID for domain validation and DNS records."

  CertificateArn:
    Type: String
    Default: ""
    Description: "(Optional) Existing ACM Certificate ARN. Leave blank to auto-create one for CustomDomainName."

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET]

  GoogleClientSecretArn:
    Type: String
    Description: "ARN of the Google OAuth Secret in Secrets Manager"

  BrivoApiKeyArn:
    Type: String
    Description: "ARN of the Brivo API Key in Secrets Manager"

  BrivoScanTable:
    Type: String
    Description: "Table name of table that holds log entries"

  DeploymentTimestamp:
    Type: String
    Default: 'Not Set'
    Description: "Deployment UTC timestamp."

Conditions:
  # Logic: If CertificateArn is empty, we create a new one
  CreateAcmCert: !Equals [!Ref CertificateArn, ""]

Resources:
  # --- Infrastructure / Networking ---
  HomeCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateAcmCert
    Properties:
      DomainName: !Ref CustomDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref CustomDomainName
          HostedZoneId: !Ref HostedZoneId

  MyHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['GET','POST','OPTIONS']
      Domain:
        DomainName: !Ref CustomDomainName
        CertificateArn: !If [CreateAcmCert, !Ref HomeCertificate, !Ref CertificateArn]
        Route53:
          HostedZoneId: !Ref HostedZoneId

  MyWebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
      BuildProperties:
        RequirementsFile: requirements.txt   # relative to CodeUri (src/)
    Properties:
      Description: !Sub "API Gateway environment"
      Runtime: python3.13
      CodeUri: src/
      Handler: app.main.lambda_handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BrivoScanTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref GoogleClientSecretArn
                - !Ref BrivoApiKeyArn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${ImageBucketName}"
                - !Sub "arn:${AWS::Partition}:s3:::${ImageBucketName}/*"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /{proxy+}
            Method: ANY
        HeartbeatEvent:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"source": "aws.events", "detail-type": "Scheduled Event"}'
        S3UploadEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [ "aws.s3" ]
              detail-type: [ "Object Created" ]
              detail:
                bucket:
                  name: [ !Ref ImageBucketName ]
                object:
                  key: [ { "prefix": "uploads/" } ]

Outputs:
  ApiEndpoint:
    Description: "The custom domain URL for your API"
    Value: !Sub "https://${CustomDomainName}/"

  StackRegion:
    Description: "Region this stack is deployed to"
    Value: !Ref "AWS::Region"
